[project]
name = "clearance"
version = "0.1.0"
description = "Configurable intake and qualification engine for DME orders, driven by criteria packs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.40",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "pillow>=10.4",
  "pypdfium2>=4.30",
  "reportlab>=4.2",
  "rapidocr-onnxruntime>=1.3",
]

[project.scripts]
clearance = "clearance.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "respx>=0.21", "matplotlib>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
