# Medicare FFS — home oxygen, initial coverage (Group I and Group II).
#
# Verified 2026-10-26 against LCD L33797 revision R11 (effective 2023-04-01).
# Scope notes:
#   - "Chronic stable state" was removed from the LCD (09/27/2021); not checked.
#   - Group III (cluster headache) and portable-only criteria are out of scope.
#   - "Time of need" and "home oxygen will improve the condition" are clinical judgments
#     left to the reviewer; this pack checks what the packet must document.
pack_id: medicare-oxygen-home
version: 1.0.0
item:
  name: "Home oxygen (stationary concentrator), initial coverage"
  hcpcs: [E1390, E0431, E0439]
payer: medicare-ffs

sources:
  - id: lcd
    title: "LCD L33797: Oxygen and Oxygen Equipment"
    url: https://www.cms.gov/medicare-coverage-database/view/lcd.aspx?lcdid=33797
    effective: "2023-04-01 (R11)"
  - id: sdr
    title: "Article A55426: Standard Documentation Requirements for All Claims Submitted to DME MACs"
    url: https://www.cms.gov/medicare-coverage-database/view/article.aspx?articleid=55426
  - id: checklist
    title: "CGS DME MAC Jurisdiction C: oxygen documentation checklist"
    url: https://www.cgsmedicare.com/jc/mr/documentation_checklists.html

extraction:
  document_types:
    - id: order_swo
      title: Standard written order
      hints: ["standard written order", "written order", "order for durable", "dme order", "prescription", "oxygen order", "order for home oxygen", "length of need", "flow rate"]
    - id: face_to_face_note
      title: Treating practitioner visit note
      hints: ["office visit", "progress note", "clinic note", "history of present illness", "chief complaint", "assessment and plan"]
    - id: blood_gas_report
      title: Oxygen saturation or blood gas test
      hints: ["oximetry", "arterial blood gas", "blood gas", "oxygen saturation test", "spo2", "pao2"]
    - id: insurance_card
      title: Insurance card
      hints: ["medicare health insurance", "entitled to", "coverage starts"]
    - id: cover_sheet
      title: Fax cover sheet
      hints: ["fax cover", "facsimile", "number of pages", "confidentiality notice", "transmittal"]

  fields:
    - {name: patient_name, type: string, required: true, labels: ["Patient Name", "Patient", "Beneficiary Name", "Name"]}
    - {name: patient_dob, type: date, required: true, labels: ["Date of Birth", "DOB", "Birth Date"]}
    - {name: medicare_id, type: string, required: true, labels: ["Medicare ID", "MBI", "Medicare Number", "Medicare Beneficiary ID"]}
    - {name: ordering_provider_name, type: string, required: true, document_type: order_swo,
       labels: ["Ordering Practitioner", "Treating Practitioner", "Ordering Physician", "Prescriber"]}
    - {name: ordering_npi, type: string, required: true, document_type: order_swo,
       labels: ["Practitioner NPI", "Prescriber NPI", "NPI"]}
    - {name: item_ordered, type: string, required: true, document_type: order_swo,
       labels: ["Item Ordered", "Equipment", "Item", "Device"]}
    - {name: order_date, type: date, required: true, document_type: order_swo,
       labels: ["Order Date", "Date of Order", "Date Ordered"]}
    - {name: order_signed, type: boolean, required: true, document_type: order_swo, detect: ink,
       labels: ["Practitioner Signature", "Signature"]}
    - {name: test_date, type: date, required: true, document_type: blood_gas_report,
       labels: ["Test Date", "Date of Test", "Date Performed"]}
    - {name: test_condition, type: enum, values: [rest, exercise, sleep], required: true, document_type: blood_gas_report,
       labels: ["Test Condition", "Testing Condition", "Condition"]}
    - {name: on_room_air, type: boolean, required: true, document_type: blood_gas_report,
       labels: ["On Room Air", "Room Air", "Breathing Room Air"]}
    - {name: spo2, type: number, required: false, document_type: blood_gas_report,
       labels: ["Qualifying SpO2", "Lowest SpO2", "Oxygen Saturation", "SpO2"]}
    - {name: po2, type: number, required: false, document_type: blood_gas_report,
       labels: ["Arterial PO2", "PaO2", "PO2"]}
    - {name: baseline_spo2, type: number, required: false, document_type: blood_gas_report,
       labels: ["Awake Resting SpO2", "Baseline SpO2", "Resting SpO2"]}
    - {name: test_performer, type: enum, values: [practitioner, laboratory, hospital, supplier], required: true,
       document_type: blood_gas_report, labels: ["Performed By", "Tested By", "Test Performed By"]}
    - {name: hematocrit, type: number, required: false, labels: ["Hematocrit", "Hct"]}

rules:
  - id: order_signed
    type: present_true
    field: order_signed
    source: sdr
    cite: "Standard Written Order (SWO): treating practitioner signature"
    on_fail: needs_info
    message: "The written order is not signed by the treating practitioner."
    request: "A standard written order for home oxygen signed and dated by the treating practitioner."

  - id: order_elements
    type: all_of
    source: sdr
    cite: "Standard Written Order (SWO): required elements"
    on_fail: needs_info
    request: "A complete standard written order (beneficiary name or MBI, order date, item description, treating practitioner name or NPI)."
    rules:
      - {type: present, field: patient_name}
      - {type: present, field: order_date}
      - {type: present, field: item_ordered}
      - {type: present, field: ordering_provider_name}

  - id: mbi_format
    type: pattern
    field: medicare_id
    regex: "[1-9][AC-HJKMNP-RT-Y][AC-HJKMNP-RT-Y0-9][0-9][AC-HJKMNP-RT-Y][AC-HJKMNP-RT-Y0-9][0-9][AC-HJKMNP-RT-Y]{2}[0-9]{2}"
    source: checklist
    cite: "Beneficiary information: Medicare Beneficiary Identifier"
    on_fail: needs_info
    request: "The patient's Medicare Beneficiary Identifier (MBI) as shown on their Medicare card."

  - id: qualifying_blood_gas
    type: any_of
    source: lcd
    cite: "Initial coverage: Group I and Group II blood gas criteria (tested while breathing room air)"
    on_fail: needs_info
    request: "A qualifying oxygen saturation or arterial blood gas result, tested on room air, with the test condition (rest, exercise, or sleep) and, for exercise or sleep testing, the awake resting value."
    options:
      - type: all_of
        cite: "Group I: at rest, awake, room air: PO2 <= 55 mm Hg or SpO2 <= 88%"
        rules:
          - {type: in, field: test_condition, values: [rest]}
          - {type: present_true, field: on_room_air}
          - type: any_of
            options:
              - {type: numeric, field: spo2, op: "<=", value: 88}
              - {type: numeric, field: po2, op: "<=", value: 55}
      - type: all_of
        cite: "Group I: during exercise or sleep, PO2 <= 55 or SpO2 <= 88%, with awake resting SpO2 >= 89%"
        rules:
          - {type: in, field: test_condition, values: [exercise, sleep]}
          - {type: present_true, field: on_room_air}
          - type: any_of
            options:
              - {type: numeric, field: spo2, op: "<=", value: 88}
              - {type: numeric, field: po2, op: "<=", value: 55}
          - {type: numeric, field: baseline_spo2, op: ">=", value: 89}
      - type: all_of
        cite: "Group II: PO2 56-59 mm Hg or SpO2 89%, plus edema suggesting CHF, pulmonary hypertension or cor pulmonale, or hematocrit > 56%"
        rules:
          - {type: present_true, field: on_room_air}
          - type: any_of
            options:
              - {type: numeric, field: spo2, op: "==", value: 89}
              - {type: numeric_range, field: po2, min: 56, max: 59}
          - type: any_of
            options:
              - {type: numeric, field: hematocrit, op: ">", value: 56}
              - type: llm_judgment
                question: >-
                  Does the record document dependent edema suggesting congestive heart failure,
                  pulmonary hypertension, or cor pulmonale?
                require_quote: true
                keywords: ["dependent edema", "pitting edema", "pedal edema", "lower extremity edema",
                           "pulmonary hypertension", "cor pulmonale", "right heart failure",
                           "congestive heart failure", "chf"]

  - id: qualified_tester
    type: in
    field: test_performer
    values: [practitioner, laboratory, hospital]
    source: lcd
    cite: "Testing specifications: a supplier is not considered a qualified provider or laboratory"
    on_fail: needs_info
    message: "The qualifying test was performed by the DME supplier, which the LCD does not accept."
    request: "A qualifying test performed by the treating practitioner or a qualified laboratory, not by the supplier."

  - id: test_before_order
    type: date_order
    a: test_date
    b: order_date
    relation: on_or_before
    source: lcd
    cite: "Initial coverage item 1: the treating practitioner ordered and evaluated the results of a qualifying blood gas study"
    on_fail: needs_info
    message: "The qualifying test is dated after the order, so the order could not have been based on it."
    request: "The qualifying test that the treating practitioner evaluated before ordering oxygen."

  - id: provider_active
    type: external
    check: npi_registry
    field: ordering_npi
    inputs: {name: ordering_provider_name}
    source: sdr
    cite: "Treating practitioner identified by name or NPI; NPPES NPI Registry lookup"
    on_fail: human_review

  - id: coverage_active
    type: external
    check: eligibility
    inputs: {member_id: medicare_id, name: patient_name, dob: patient_dob}
    source: checklist
    cite: "Beneficiary eligibility on the date of service"
    on_fail: human_review

routing:
  auto_ready_min_confidence: 0.92
  unverifiable_below: 0.6
  never_auto: [llm_judgment_failures]

outreach:
  template: missing_items_fax.md.j2
